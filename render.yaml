services:
  - type: web
    name: delta-fareguard
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm rebuild sqlite3 && cd src/frontend && npm install --include=dev && npm run build
    startCommand: node src/backend/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
