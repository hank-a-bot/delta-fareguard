services:
  - type: web
    name: delta-fareguard
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
